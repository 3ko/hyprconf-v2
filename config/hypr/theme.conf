# Shared configuration for theme, menu, and power scripts
# Paths are expanded at runtime by scripts sourcing theme.sh

# Theme selection
DEFAULT_THEME_NAME="Catppuccin"
PREVIOUS_THEME_CACHE="$HOME/.config/hypr/.cache/.theme.previous"
CURRENT_THEME_CACHE="$HOME/.config/hypr/.cache/.theme"

# Wallpaper tracking
WALLPAPER_CACHE_FILE="$HOME/.config/hypr/.cache/.wallpaper"
WALLPAPER_LINK_TARGET="$HOME/.config/hypr/.cache/current_wallpaper.png"

# Directories
HYPR_SCRIPTS_DIR="$HOME/.config/hypr/scripts"
THEME_ASSETS_DIR="$HOME/.config/hypr/assets"
THEME_CONFIG_DIR="$HOME/.config/hypr/confs/themes"
WALLPAPER_DIR="$HOME/.config/hypr/Wallpapers"

ROFI_BASE_DIR="$HOME/.config/rofi"
ROFI_THEME_DIR="$ROFI_BASE_DIR/themes"
ROFI_COLOR_DIR="$ROFI_BASE_DIR/colors"
ROFI_MENU_DIR="$ROFI_BASE_DIR/menu"
ROFI_POWER_DIR="$ROFI_BASE_DIR/power_option"
ROFI_ASSET_DIR="$ROFI_BASE_DIR/assets"

KITTY_THEME_DIR="$HOME/.config/kitty/colors"
WAYBAR_THEME_DIR="$HOME/.config/waybar/colors"
WLOGOUT_THEME_DIR="$HOME/.config/wlogout/colors"
SWAYNC_THEME_DIR="$HOME/.config/swaync/colors"

# Desktop integration
DUNST_CONFIG_PATH="$HOME/.config/dunst/dunstrc"
KVANTUM_CONFIG_PATH="$HOME/.config/Kvantum/kvantum.kvconfig"
VSCODE_SETTINGS_PATH="$HOME/.config/Code/User/settings.json"

# Menu and power rofi themes
MENU_THEME_NAME="style-3"
POWERMENU_THEME_NAME="small"
